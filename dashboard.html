<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jest Financeiro - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --green: #10b981;
      --green-light: rgba(16, 185, 129, 0.15);
      --red: #ef4444;
      --red-light: rgba(239, 68, 68, 0.15);
      --yellow: #f59e0b;
      --yellow-light: rgba(245, 158, 11, 0.15);
      --blue: #3b82f6;
      --blue-light: rgba(59, 130, 246, 0.15);
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.08), transparent);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding: 20px 28px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent-light);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .last-update {
      color: var(--text-muted);
      font-size: 12px;
      margin-right: 8px;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--blue));
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn:active { transform: translateY(0); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      box-shadow: none;
      color: var(--text-secondary);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      box-shadow: none;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
    }

    .card:nth-child(1)::before { background: linear-gradient(90deg, var(--blue), var(--accent)); }
    .card:nth-child(2)::before { background: linear-gradient(90deg, var(--green), #34d399); }
    .card:nth-child(3)::before { background: linear-gradient(90deg, var(--red), #f87171); }
    .card:nth-child(4)::before { background: linear-gradient(90deg, var(--yellow), #fbbf24); }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card:nth-child(1) .card-icon { background: var(--blue-light); }
    .card:nth-child(2) .card-icon { background: var(--green-light); }
    .card:nth-child(3) .card-icon { background: var(--red-light); }
    .card:nth-child(4) .card-icon { background: var(--yellow-light); }

    .card .value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .card:nth-child(1) .value { color: var(--blue); }
    .card:nth-child(2) .value { color: var(--green); }
    .card:nth-child(3) .value { color: var(--red); }
    .card:nth-child(4) .value { color: var(--yellow); }

    .card .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Charts Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .chart-card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-container {
      position: relative;
      height: 280px;
    }

    /* Table Section */
    .table-section {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-header h2 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-primary);
      padding: 4px;
      border-radius: 10px;
    }

    .filter-tab {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-tab.active {
      background: var(--accent);
      color: white;
    }

    .filter-tab:hover:not(.active) {
      color: var(--text-primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      font-size: 14px;
      color: var(--text-secondary);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-pass {
      background: var(--green-light);
      color: var(--green);
    }

    .status-fail {
      background: var(--red-light);
      color: var(--red);
    }

    .status-skip {
      background: var(--yellow-light);
      color: var(--yellow);
    }

    .progress-bar {
      width: 100px;
      height: 6px;
      background: var(--bg-primary);
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .progress-fill.green { background: var(--green); }
    .progress-fill.yellow { background: var(--yellow); }
    .progress-fill.red { background: var(--red); }

    /* Error */
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .error-icon { font-size: 18px; }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 12px;
    }

    footer a {
      color: var(--accent-light);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 1024px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .cards-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; gap: 16px; text-align: center; }
      .header-right { flex-direction: column; }
      .table-header { flex-direction: column; gap: 12px; }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card, .chart-card, .table-section {
      animation: fadeIn 0.5s ease forwards;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <div class="logo">J</div>
        <div>
          <h1>Jest <span>Financeiro</span> Dashboard</h1>
        </div>
      </div>
      <div class="header-right">
        <span class="last-update" id="lastUpdate">-</span>
        <button class="btn btn-outline" onclick="fetchData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          Atualizar
        </button>
        <button class="btn" id="runTestsBtn" onclick="runTests()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Executar Testes
        </button>
      </div>
    </header>

    <div id="errorContainer"></div>

    <div class="cards-grid">
      <div class="card">
        <div class="card-header">
          <h3>Total de Testes</h3>
          <div class="card-icon">📊</div>
        </div>
        <div class="value" id="totalTests">0</div>
        <div class="subtitle" id="totalSubtitle">-</div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Passando</h3>
          <div class="card-icon">✓</div>
        </div>
        <div class="value" id="passingTests">0</div>
        <div class="subtitle" id="passingSubtitle">-</div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Falhando</h3>
          <div class="card-icon">✗</div>
        </div>
        <div class="value" id="failingTests">0</div>
        <div class="subtitle" id="failingSubtitle">-</div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Cobertura Média</h3>
          <div class="card-icon">📈</div>
        </div>
        <div class="value" id="coverageAvg">0%</div>
        <div class="subtitle" id="coverageSubtitle">-</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          Cobertura de Código
        </h2>
        <div class="chart-container">
          <canvas id="coverageChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
          Tempo de Execução
        </h2>
        <div class="chart-container">
          <canvas id="timeChart"></canvas>
        </div>
      </div>
    </div>

    <div class="table-section">
      <div class="table-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Testes por Arquivo
        </h2>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all" onclick="filterTable('all')">Todos</button>
          <button class="filter-tab" data-filter="passed" onclick="filterTable('passed')">Passou</button>
          <button class="filter-tab" data-filter="failed" onclick="filterTable('failed')">Falhou</button>
        </div>
      </div>
      <div id="testSuites">
        <div class="loading"><div class="spinner"></div><span>Carregando dados...</span></div>
      </div>
    </div>

    <footer>
      <p>
        Verificar status no
        <a href="https://github.com/rafarfelipe/jest-financeiro-testes/actions" target="_blank">GitHub Actions</a>
        • Atualização automática a cada 30s
      </p>
    </footer>
  </div>

  <script>
    let coverageChartInstance = null;
    let timeChartInstance = null;
    let allSuites = [];
    let currentFilter = 'all';

    const chartColors = {
      green: '#10b981',
      red: '#ef4444',
      yellow: '#f59e0b',
      blue: '#3b82f6',
      purple: '#8b5cf6',
      accent: '#6366f1',
      grid: 'rgba(255, 255, 255, 0.05)',
      text: '#94a3b8'
    };

    async function fetchData() {
      hideError();
      try {
        const [reportRes, coverageRes] = await Promise.all([
          fetch('/api/report').catch(() => null),
          fetch('/api/coverage').catch(() => null)
        ]);

        const report = reportRes && reportRes.ok ? await reportRes.json() : null;
        const coverage = coverageRes && coverageRes.ok ? await coverageRes.json() : null;

        if (report) renderReport(report);
        if (coverage) renderCoverage(coverage);

        document.getElementById('lastUpdate').textContent =
          `Atualizado: ${new Date().toLocaleTimeString('pt-BR')}`;
      } catch (err) {
        showError('Erro ao carregar dados: ' + err.message);
      }
    }

    function renderReport(data) {
      const total = data.numTotalTests || 0;
      const passed = data.numPassedTests || 0;
      const failed = data.numFailedTests || 0;
      const skipped = total - passed - failed;

      animateValue('totalTests', total);
      animateValue('passingTests', passed);
      animateValue('failingTests', failed);

      document.getElementById('totalSubtitle').textContent = `${data.numTotalTestSuites || 0} suites`;
      document.getElementById('passingSubtitle').textContent = `${((passed / total) * 100 || 0).toFixed(1)}% do total`;
      document.getElementById('failingSubtitle').textContent = failed > 0 ? `${failed} teste(s) com erro` : 'Tudo certo!';

      allSuites = data.testResults || [];
      renderTable(allSuites);
      renderTimeChart(allSuites);
    }

    function renderCoverage(data) {
      const files = Object.values(data).filter(f => f && (f.s || f.fnMap || f.l));
      if (files.length === 0) return;

      let stmt = 0, fn = 0, lines = 0, branch = 0;
      let stmtC = 0, fnC = 0, lineC = 0, branchC = 0;

      files.forEach(f => {
        if (f.s) {
          const keys = Object.keys(f.s);
          const covered = keys.filter(k => f.s[k] > 0).length;
          stmt += (covered / keys.length) * 100;
          stmtC++;
        }
        if (f.fnMap) {
          const keys = Object.keys(f.f || {});
          const covered = keys.filter(k => f.f[k] > 0).length;
          fn += keys.length > 0 ? (covered / keys.length) * 100 : 100;
          fnC++;
        }
        if (f.l) {
          const linesArr = Object.values(f.l);
          const covered = linesArr.filter(v => v > 0).length;
          lines += (covered / linesArr.length) * 100;
          lineC++;
        }
        if (f.branchMap) {
          const branches = Object.values(f.b || {});
          const totalB = branches.length;
          const coveredB = branches.filter(b => b > 0).length;
          branch += totalB > 0 ? (coveredB / totalB) * 100 : 100;
          branchC++;
        }
      });

      const stmtAvg = stmtC > 0 ? stmt / stmtC : 0;
      const fnAvg = fnC > 0 ? fn / fnC : 0;
      const lineAvg = lineC > 0 ? lines / lineC : 0;
      const branchAvg = branchC > 0 ? branch / branchC : 100;
      const overall = ((stmtAvg + fnAvg + lineAvg + branchAvg) / 4);

      document.getElementById('coverageAvg').textContent = overall.toFixed(1) + '%';

      const subtitle = document.getElementById('coverageSubtitle');
      if (overall >= 80) subtitle.textContent = 'Cobertura excelente';
      else if (overall >= 60) subtitle.textContent = 'Cobertura média';
      else subtitle.textContent = 'Cobertura baixa';

      renderCoverageChart(stmtAvg, fnAvg, lineAvg, branchAvg);
    }

    function renderCoverageChart(stmt, fn, lines, branch) {
      const ctx = document.getElementById('coverageChart').getContext('2d');

      if (coverageChartInstance) coverageChartInstance.destroy();

      coverageChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Statements', 'Functions', 'Lines', 'Branches'],
          datasets: [{
            data: [stmt, fn, lines, branch],
            backgroundColor: [
              chartColors.blue,
              chartColors.purple,
              chartColors.green,
              chartColors.yellow
            ],
            borderWidth: 0,
            borderRadius: 4,
            spacing: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '75%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: chartColors.text,
                padding: 16,
                font: { size: 12, family: 'Inter' },
                usePointStyle: true,
                pointStyleWidth: 10
              }
            },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f1f5f9',
              bodyColor: '#94a3b8',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              cornerRadius: 8,
              padding: 12,
              callbacks: {
                label: (ctx) => ` ${ctx.label}: ${ctx.parsed.toFixed(1)}%`
              }
            }
          }
        }
      });
    }

    function renderTimeChart(suites) {
      const ctx = document.getElementById('timeChart').getContext('2d');

      let items = [];
      suites.forEach(suite => {
        const name = suite.name.split('\\').pop().split('/').pop().replace('.test.js', '');
        const time = ((suite.endTime || 0) - (suite.startTime || 0)) / 1000;
        if (time > 0) {
          items.push({ name, time });
        }
      });

      items.sort((a, b) => b.time - a.time);
      items = items.slice(0, 8);

      if (timeChartInstance) timeChartInstance.destroy();

      timeChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: items.map(i => i.name),
          datasets: [{
            label: 'Tempo (s)',
            data: items.map(i => i.time),
            backgroundColor: items.map(i =>
              i.time > 1 ? chartColors.red + 'cc' :
              i.time > 0.5 ? chartColors.yellow + 'cc' :
              chartColors.green + 'cc'
            ),
            borderColor: items.map(i =>
              i.time > 1 ? chartColors.red :
              i.time > 0.5 ? chartColors.yellow :
              chartColors.green
            ),
            borderWidth: 1,
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f1f5f9',
              bodyColor: '#94a3b8',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              cornerRadius: 8,
              padding: 12,
              callbacks: {
                label: (ctx) => ` ${ctx.parsed.x.toFixed(2)}s`
              }
            }
          },
          scales: {
            x: {
              grid: { color: chartColors.grid },
              ticks: { color: chartColors.text, font: { size: 11 } },
              title: { display: true, text: 'Segundos', color: chartColors.text }
            },
            y: {
              grid: { display: false },
              ticks: { color: chartColors.text, font: { size: 11 } }
            }
          }
        }
      });
    }

    function renderTable(suites) {
      const container = document.getElementById('testSuites');

      if (suites.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Nenhum teste encontrado</p></div>';
        return;
      }

      let html = `<table>
        <thead><tr>
          <th>Arquivo</th>
          <th>Status</th>
          <th>Passou</th>
          <th>Falhou</th>
          <th>Cobertura</th>
          <th>Tempo</th>
        </tr></thead>
        <tbody>`;

      suites.forEach(suite => {
        const name = suite.name.split('\\').pop().split('/').pop();
        const status = suite.status === 'passed' ? 'pass' : 'fail';
        const statusText = suite.status === 'passed' ? 'Passou' : 'Falhou';
        const time = (((suite.endTime || 0) - (suite.startTime || 0)) / 1000).toFixed(2);

        // Count from assertionResults
        const assertions = suite.assertionResults || [];
        const passCount = assertions.filter(a => a.status === 'passed').length;
        const failCount = assertions.filter(a => a.status === 'failed').length;
        const total = passCount + failCount;
        const pct = total > 0 ? (passCount / total) * 100 : 0;
        const cls = pct >= 90 ? 'green' : pct >= 50 ? 'yellow' : 'red';

        html += `<tr class="row-${suite.status}">
          <td><strong>${name}</strong></td>
          <td><span class="status-badge status-${status}">${statusText}</span></td>
          <td style="color: var(--green)">${passCount}</td>
          <td style="color: var(--red)">${failCount}</td>
          <td>
            <div class="progress-bar">
              <div class="progress-fill ${cls}" style="width: ${pct}%"></div>
            </div>
            ${pct.toFixed(0)}%
          </td>
          <td>${time}s</td>
        </tr>`;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function filterTable(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.filter === filter);
      });

      if (filter === 'all') {
        renderTable(allSuites);
      } else if (filter === 'passed') {
        renderTable(allSuites.filter(s => s.status === 'passed'));
      } else if (filter === 'failed') {
        renderTable(allSuites.filter(s => s.status === 'failed'));
      }
    }

    function animateValue(id, end) {
      const el = document.getElementById(id);
      const start = parseInt(el.textContent) || 0;
      const duration = 600;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(start + (end - start) * eased);
        if (progress < 1) requestAnimationFrame(update);
      }

      requestAnimationFrame(update);
    }

    async function runTests() {
      const btn = document.getElementById('runTestsBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px"></div> Executando...';
      hideError();

      try {
        const res = await fetch('/api/run-tests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'all' })
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Resposta inválida: ' + text.substring(0, 100));
        }

        if (data.success) {
          await fetchData();
        } else {
          showError('Erro ao executar testes: ' + (data.error || 'Erro desconhecido'));
        }
      } catch (err) {
        showError('Erro: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> Executar Testes';
      }
    }

    function showError(msg) {
      document.getElementById('errorContainer').innerHTML =
        `<div class="error"><span class="error-icon">⚠️</span>${msg}</div>`;
    }

    function hideError() {
      document.getElementById('errorContainer').innerHTML = '';
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
